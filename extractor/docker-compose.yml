# 可直接启动的演示环境：
#   source-db : 本地源 PostgreSQL（自动建表+灌入关联样例，含成环复测）
#   api       : FastAPI 提取服务，源库地址固定通过 SOURCE_DSN 配置
#   target-db : 空 PostgreSQL，用于演示把提取结果导入空库（可选启用）
#
# 使用：
#   docker compose up -d --build
#   open http://localhost:8000/docs

services:
  source-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: qcpass
      POSTGRES_DB: qcwarehouse
    ports:
      - "55432:5432"
    volumes:
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./sql/03_corrections.sql:/docker-entrypoint-initdb.d/03_corrections.sql:ro
      - source_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc -d qcwarehouse"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      source-db:
        condition: service_healthy
    environment:
      # 源库地址固定配置（仅从环境变量读取，API 不接受任意库地址）
      SOURCE_DSN: postgresql://qc:qcpass@source-db:5432/qcwarehouse
      OUTPUT_DIR: /data/output
      MAX_WORKERS: "2"
      # 演示“提取期间修改源记录”时保持快照打开 3 秒；生产环境设为 0
      SNAPSHOT_DELAY: "3"
    ports:
      - "8000:8000"
    volumes:
      - output_data:/data/output

  # 空库：仅用于演示导入。不挂载任何初始化 SQL，保持“空 PostgreSQL 库”
  target-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: qcpass
      POSTGRES_DB: qctarget
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc -d qctarget"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  source_pgdata:
  output_data:
